<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite | Dashboard</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/quiz.css">
    <link rel="icon" href="../assets/icon/Fortnite_logo.png">
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="janela">
        <div class="header-left">
            <img src="../assets/imagens/fortnite.png" alt="Fortnite">

            <div class="hello">
                <div class="perfil">
                    <img src="../assets/imagens/renegade.png" alt="Perfil">
                </div>
                <h3><span id="b_usuario">usuário</span></h3>
            </div>

            <div class="btn-nav">
                <a href="dashboard.html">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="#">
                    <h3>Gráficos</h3>
                </a>


            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3><img src="../assets/imagens/logout_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
                    alt="Logout">
            </div>

        </div>

        <div class="dashboard">
            <div class="indicadores">
                <div class="caixas">
                <h3>Questão mais fácil:</h3>
                <p id="perguntaFacil"></p>
                <span>Acertos:</span><p id="acertosFacil"></p>
                <span>Tentativas:</span><p id="tentativasFacil"></p>
            </div>

            <div class="caixas">
                <h3>Questão mais difícil:</h3>
                <p id="perguntaDificil"></p>
                <span>Acertos:</span><p id="acertosDificil"></p>
                <span>Tentativas:</span><p id="tentativasDificil"></p>
            </div>
            </div>

            <div class="grafico">
        <h3>Gráfico – Questões</h3>
    <canvas id="myChartCanvas"></canvas>
        </div>

        </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    document.addEventListener("DOMContentLoaded", () => {

        // Buscar questão mais difícil
        fetch("/quiz/maisDificil")
            .then(response => response.json())
            .then(data => {

                const questao = data[0];

                console.log("Questão mais difícil:", questao);
                console.log("Pergunta:", questao.pergunta);
                console.log("Acertos:", questao.Acertos);
                console.log("Tentativas:", questao.Tentativas);

                // Exemplo: exibir no HTML
                document.getElementById("perguntaDificil").innerText = questao.pergunta;
                document.getElementById("acertosDificil").innerText = questao.Acertos;
                document.getElementById("tentativasDificil").innerText = questao.Tentativas;

            })
            .catch(error => {
                console.error("Erro ao buscar questão mais difícil:", error);
            });


        // Buscar questão mais fácil
        fetch("/quiz/maisFacil")
            .then(response => response.json())
            .then(data => {

                const questao = data[0];

                console.log("Questão mais fácil:", questao);
                console.log("Pergunta:", questao.pergunta);
                console.log("Acertos:", questao.Acertos);
                console.log("Tentativas:", questao.Tentativas);

                // Exemplo: exibir no HTML
                document.getElementById("perguntaFacil").innerText = questao.pergunta;
                document.getElementById("acertosFacil").innerText = questao.Acertos;
                document.getElementById("tentativasFacil").innerText = questao.Tentativas;

            })
            .catch(error => {
                console.error("Erro ao buscar questão mais fácil:", error);
            });

    });



</script>
