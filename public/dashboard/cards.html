<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite | Dashboard</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/quiz.css">
    <link rel="icon" href="../assets/icon/Fortnite_logo.png">
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

</head>

<body>

    <div class="janela">
        <div class="header-left">
            <img src="../assets/imagens/fortnite.png" alt="Fortnite">

            <div class="hello">
                <div class="perfil">
                    <img src="../assets/imagens/renegade.png" alt="Perfil">
                </div>
                <h3><span id="b_usuario">usuário</span></h3>
            </div>

            <div class="btn-nav">
                <a href="dashboard.html">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="#">
                    <h3>Gráficos</h3>
                </a>


            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3><img src="../assets/imagens/logout_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
                    alt="Logout">
            </div>

        </div>

        <div class="dash">
            <div class="caixas">
    <h3>Questão mais fácil:</h3>
    <p id="maisFacil"></p>
</div>

<div class="caixas">
    <h3>Questão mais difícil:</h3>
    <p id="maisDificil"></p>
</div>

        </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    fetch("/quiz/estatisticas")
  .then(res => res.json())
  .then(data => {
     document.getElementById("maisFacil").innerHTML =
        `${data.facil.pergunta} (${data.facil.porcentagem_acertos.toFixed(1)}% acertos)`;

     document.getElementById("maisDificil").innerHTML =
        `${data.dificil.pergunta} (${data.dificil.porcentagem_acertos.toFixed(1)}% acertos)`;
  });

</script>
